name: Gravity Runner - Portfolio CI/CD

# This repository publishes portfolio source code, not a complete Unity project.
# Android APK/AAB builds and Google Play deployment are intentionally NOT attempted.
on:
  push:
    branches: [main]
    tags: ["portfolio-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate C# syntax and README links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run portfolio source validator
        run: dotnet run --project tools/RepoValidator/RepoValidator.csproj --configuration Release -- .

  publish-source:
    name: Publish portfolio source archive
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/portfolio-v')
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Package public portfolio files
        run: zip -r "Gravity-Runner-${GITHUB_REF_NAME}.zip" README.md Docs Script

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "Gravity-Runner-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --title "Gravity Runner source ${GITHUB_REF_NAME}" \
            --notes "Portfolio source snapshot containing README, screenshots, and C# scripts. This is NOT a playable Unity build, APK, or AAB."
